name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest faker groq structlog slowapi prometheus-client
      - name: Run Safety Predicate Tests (1000 Universes)
        run: pytest tests/test_1000_universes.py -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ secrets.SERVER_HOST != '' }}
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/payresq
            git pull origin main
            docker-compose -f razorpay_enterprise/docker-compose.yml down
            docker-compose -f razorpay_enterprise/docker-compose.yml up -d --build
